name: Tracker Auto Sync

# 🛡️ إلغاء أي تشغيل قديم معلق فور تشغيل واحد جديد لمنع التراكم وتوفير الموارد
concurrency:
  group: sync-tracker-group
  cancel-in-progress: true

on:
  schedule:
    - cron: '*/5 * * * *' # بيشتغل تلقائياً كل 5 دقائق (تقدر تغيرها)
  workflow_dispatch: # بيسمحلك تشغله يدوي في أي وقت

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install Dependencies
        run: npm install

      - name: Run Tracker Sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node index.js
